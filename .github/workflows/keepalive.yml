name: Supabase Keepalive Ping

on:
  schedule:
    # Run once daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Services
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets not configured, skipping ping"
            exit 0
          fi
          
          echo "Pinging Supabase Auth health endpoint..."
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/auth/v1/health")
          echo "Auth health HTTP status: $AUTH_STATUS"

          echo "Pinging PostgREST endpoint with table query..."
          REST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/orders?select=id&limit=1")
          echo "PostgREST query HTTP status: $REST_STATUS"

          # Auth endpoint returns 200; PostgREST returns 200 (if table migrated) or 404 (if pre-migration)
          if [ "$AUTH_STATUS" -eq 200 ]; then
            echo "Keepalive successful. Supabase project is active."
          else
            echo "Keepalive failed. Auth service returned $AUTH_STATUS"
            exit 1
          fi
